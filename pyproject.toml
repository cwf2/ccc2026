[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ccc2026"
version = "0.1.0"
authors = [
    { name="Christopher W. Forstall", email="cforstall@mta.ca" },
    { name="Berenice Verhelst", email="b.verhelst@uva.nl" },
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "osfclient",
    "jupyter",
    "ipywidgets",
]

[tool.setuptools.packages.find]
where = ["src"]
